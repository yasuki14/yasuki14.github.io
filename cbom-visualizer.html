<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBOM Visualizer</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --ink:#1c2430; --sub:#5b6675; --line:#d9dee5; --head:#eef1f5;
    --accent:#1f5f8b; --btn-ink:#fff;
    --ng:#a3262a; --ng-bg:#fbe9ea; --warn:#7a4b00; --warn-bg:#fdf1d8; --ok:#1d6b3e; --ok-bg:#e4f4ea; --na-bg:#eceff3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181e; --panel:#1b2129; --ink:#e4e8ee; --sub:#9aa5b4; --line:#2f3844; --head:#232b35;
      --accent:#6db3e0; --btn-ink:#0d1116;
      --ng:#ff9a9d; --ng-bg:#4a2326; --warn:#f0c674; --warn-bg:#443716; --ok:#7fd6a0; --ok-bg:#1f3d2b; --na-bg:#2a323d;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 "Yu Gothic UI","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
  header{padding:16px 16px 0}
  h1{font-size:18px;margin:0 0 12px;font-weight:700}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;margin:0 16px 12px}
  .panel h2{font-size:13px;margin:0 0 8px;color:var(--sub);font-weight:600}
  .row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
  .row + .row{margin-top:10px}
  label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:3px}
  label.inline{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
  input[type=text],input[type=number],input[type=search]{
    font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
  #fname{width:min(360px,90vw)} #q{width:min(320px,90vw)}
  button{font:inherit;padding:7px 14px;border-radius:4px;border:1px solid var(--accent);
    background:var(--accent);color:var(--btn-ink);cursor:pointer}
  button.ghost{background:transparent;color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  input[type=file]{display:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #status{margin:0 16px 8px;color:var(--sub);font-size:13px;min-height:1.5em}
  #errors{margin:0 16px 8px;color:var(--ng);font-size:13px;white-space:pre-wrap}
  #secretBanner{margin:0 16px 12px;padding:10px 12px;border:1px solid var(--ng);background:var(--ng-bg);color:var(--ng);border-radius:6px;display:none}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0 16px 12px}
  .card{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;padding:8px 12px;
    background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .card b{font-size:22px;line-height:1.2}
  .card span{font-size:12px;color:var(--sub)}
  .card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 16px 8px}
  .tab{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 12px}
  .tab[aria-selected="true"]{background:var(--accent);color:var(--btn-ink);border-color:var(--accent)}
  .wrap{margin:0 16px 12px;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel);max-height:68vh}
  table{border-collapse:collapse;width:100%;min-width:900px}
  th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{position:sticky;top:0;background:var(--head);font-weight:600;cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
  th[aria-sort="ascending"]::after{content:" ▲";font-size:10px}
  th[aria-sort="descending"]::after{content:" ▼";font-size:10px}
  td.dn{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;min-width:200px}
  td.num{white-space:nowrap} td.date{white-space:nowrap}
  .tag{display:inline-block;padding:1px 8px;margin:1px 2px 1px 0;border-radius:10px;font-size:12px;white-space:nowrap}
  .tag.ng{background:var(--ng-bg);color:var(--ng)}
  .tag.warn{background:var(--warn-bg);color:var(--warn)}
  .tag.ok{background:var(--ok-bg);color:var(--ok)}
  .tag.na{background:var(--na-bg);color:var(--sub)}
  .empty{padding:24px;color:var(--sub)}
  .hint{margin:0 0 10px;color:var(--sub);font-size:12px}
  .boxTitle{font-size:13px;margin:0 0 8px;color:var(--sub);font-weight:600}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0;font-size:13px}
  .kv dt{color:var(--sub);white-space:nowrap}
  .kv dd{margin:0;word-break:break-all}
  .kv dd.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  .drop{outline:2px dashed var(--accent);outline-offset:-6px}
</style>
</head>
<body>
<header><h1>CBOM Visializer</h1></header>

<section class="panel">
  <p class="hint">CBOM(JSON)読み込み</p>
  <div class="row">
    <button id="pickFiles">ファイルを選択</button>
    <label>対象ファイル名
      <input id="fname" type="text" value="" readonly placeholder="(未選択)">
    </label>
    <label>SHA-256
      <input id="fhash" type="text" value="" readonly placeholder="(未選択)" style="width:min(480px,90vw);font-family:ui-monospace,Consolas,monospace">
    </label>
    <button id="clear" class="ghost">クリア</button>
    <input id="files" type="file" accept=".json,application/json">
  </div>
</section>

<section class="panel" id="headerBox" style="display:none">
  <h2 class="boxTitle">CBOMヘッダー</h2>
  <dl id="headerList" class="kv"></dl>
</section>

<div id="status" role="status"></div>
<div id="errors"></div>
<div id="secretBanner" role="alert"></div>

<div class="cards" id="cards"></div>
<div class="tabs" id="tabs" role="tablist"></div>

<section class="panel">
  <div class="row">
    <label>絞り込み
      <input id="q" type="search" placeholder="名前、Subject、アルゴリズム、出所など">
    </label>
    <label>期限間近のしきい値
      <span style="display:flex;align-items:center;gap:4px">
        <input id="expYears" type="number" min="0" step="1" value="2" style="width:64px">年以内
      </span>
    </label>
    <button id="csv" class="ghost" disabled>CSVで保存</button>
  </div>
</section>

<div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>

<script>
/* ================= 状態 ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows = [], errors = [], bomCount = 0;
let tabId = 'all', sortK = null, sortDir = 1, riskF = '';

/* ================= 判定ルール ================= */
const RE_PQ   = /ml-?kem|ml-?dsa|slh-?dsa|fn-?dsa|kyber|dilithium|sphincs|falcon|xmss|(^|[^a-z])(lms|hss)([^a-z]|$)|frodo|(^|[^a-z])hqc|mceliece|(^|[^a-z])bike/;
const RE_VULN = /rsa|ecdsa|ecdh|ecies|eddsa|ed25519|ed448|x25519|x448|curve25519|curve448|secp\d|prime\d|nist-?p-?\d|brainpool|(^|[^a-z])ecc([^a-z]|$)|elliptic|diffie|(^|[^a-z])dhe?([^a-z]|$)|(^|[^a-z])dsa([^a-z]|$)|(^|[^a-z])ec([^a-z]|$)/;
const RE_SAFE = /aes-?(192|256)|chacha|sha-?(256|384|512)|sha-?3|blake/;
const norm = t => String(t || '').toLowerCase().replace(/_/g, '-');

const RE_PQ_G = new RegExp(RE_PQ.source, 'g');
const PUBKEY_PRIM = ['signature', 'pke', 'key-agree', 'kem'];
function pqOf(text, level, prim){
  const s = norm(text), pq = RE_PQ.test(s), cl = RE_VULN.test(s.replace(RE_PQ_G, ' '));
  if(pq) return cl ? 'hybrid' : 'safe';
  if(cl) return 'vuln';
  // 公開鍵方式ではないが、古典的な攻撃で既に危殆化しているもの(SHA-1, MD5, DES/3DES, RC4等)は
  // 量子耐性が「不明」なのではなく、そもそも古典的に破られていることを明示する
  if(weakOf(text).length) return 'broken';
  if(/aes-?128/.test(s)) return 'vuln';
  if(RE_SAFE.test(s)) return 'safe';
  if(typeof level === 'number'){
    if(level > 0) return 'safe';
    return (!prim || PUBKEY_PRIM.includes(prim)) ? 'vuln' : 'unknown';
  }
  return 'unknown';
}
const RANK = {vuln:3, broken:3, unknown:1, safe:0, hybrid:0};
const worst = (a, b) => RANK[a] >= RANK[b] ? a : b;

function weakOf(text){
  const s = norm(text), out = [];
  if(/md[245]/.test(s)) out.push('MD系ハッシュ');
  if(/sha-?1(?!\d)|(^|[^a-z0-9])sha(?![a-z0-9]|-?\d)/.test(s)) out.push('SHA-1');
  if(/(^|[^a-z0-9])(3des|tdes|triple-des|des|des-?ede3?)([^a-z0-9]|$)/.test(s)) out.push('DES/3DES');
  if(/rc[24]|arcfour/.test(s)) out.push('RC4/RC2');
  if(/(^|[^a-z])(null|export|anon)([^a-z]|$)/.test(s)) out.push('NULL/EXPORT/anon');
  const rsa = /rsa[^0-9a-z]{0,4}(\d{3,5})/.exec(s);
  if(rsa && +rsa[1] < 2048) out.push('RSA ' + rsa[1] + ' bit');
  const ec = /(?:^|[^a-z])(?:secp|nist-?p-?|p-?)(\d{3})(?:r1|k1)?(?:[^0-9]|$)/.exec(s);
  if(ec && +ec[1] < 224) out.push('EC ' + ec[1] + ' bit');
  return out;
}
const uniq = a => [...new Set(a)];
function daysLeft(iso){
  const t = Date.parse(iso);
  return isNaN(t) ? null : Math.floor((t - Date.now()) / 86400000);
}

/* ================= CBOMの取り込み ================= */
function flat(list, out = []){ for(const c of list || []){ out.push(c); flat(c.components, out); } return out; }

function ingest(bom, src){
  if(!bom || !Array.isArray(bom.components)) throw new Error('components がありません(CBOMではない可能性)');
  const comps = flat(bom.components);
  const byRef = new Map();
  comps.forEach(c => { if(c['bom-ref']) byRef.set(c['bom-ref'], c); });
  const nm = ref => ref ? (byRef.get(ref)?.name || ref) : '';
  let n = 0;

  for(const c of comps){
    const cp = c.cryptoProperties;
    if(!cp) continue;
    const secretBlock = /-----BEGIN [A-Z ]*PRIVATE KEY-----/.test(JSON.stringify(c));
    let r = null;

    if(cp.assetType === 'certificate'){
      const p = cp.certificateProperties || {};
      const sig = nm(p.signatureAlgorithmRef);
      const pkc = byRef.get(p.subjectPublicKeyRef);
      let key = '';
      if(pkc){
        const m = pkc.cryptoProperties?.relatedCryptoMaterialProperties;
        const a = m?.algorithmRef ? nm(m.algorithmRef) : pkc.name;
        key = [a, m?.size ? m.size + ' bit' : ''].filter(Boolean).join(' ');
      } else key = p.subjectPublicKeyRef || '';
      r = {type:'certificate',
        p:{subject:p.subjectName || '', issuer:p.issuerName || '', from:p.notValidBefore || '', to:p.notValidAfter || '',
           sig, key, fmt:p.certificateFormat || ''},
        days:daysLeft(p.notValidAfter),
        pq:worst(pqOf(sig), key ? pqOf(key) : 'unknown'),
        weak:uniq([...weakOf(sig), ...weakOf(key)]),
        detail:p.subjectName || ''};
    }
    else if(cp.assetType === 'algorithm'){
      const p = cp.algorithmProperties || {};
      const fam = p.algorithmFamily || '', param = p.parameterSetIdentifier || '', curve = p.ellipticCurve || p.curve || '';
      const text = [c.name, fam, param, curve].join(' ');
      const ql = typeof p.nistQuantumSecurityLevel === 'number' ? p.nistQuantumSecurityLevel : null;
      r = {type:'algorithm',
        p:{primitive:p.primitive || '', fam, param, curve, cl:p.classicalSecurityLevel ?? null, ql,
           funcs:(p.cryptoFunctions || []).join(', '), oid:cp.oid || ''},
        days:null, pq:pqOf(text, ql, p.primitive), weak:weakOf(text),
        detail:[p.primitive, param || fam, curve].filter(Boolean).join(' ')};
    }
    else if(cp.assetType === 'related-crypto-material'){
      const p = cp.relatedCryptoMaterialProperties || {};
      const algo = nm(p.algorithmRef);
      const text = [algo, p.size ? p.size + ' bit' : '', c.name].join(' ');
      const secretType = ['private-key','secret-key','password','credential','token','seed','shared-secret'].includes(p.type);
      r = {type:'material',
        p:{mtype:p.type || '', algo, size:p.size ?? null, state:p.state || '', exp:p.expirationDate || '', fmt:p.format || ''},
        days:daysLeft(p.expirationDate), pq:pqOf(text), weak:weakOf(text),
        secret:!!p.value && secretType,
        detail:[p.type, algo, p.size ? p.size + ' bit' : ''].filter(Boolean).join(' ')};
    }
    else if(cp.assetType === 'protocol'){
      const p = cp.protocolProperties || {};
      const suites = (p.cipherSuites || []).map(s => s.name).filter(Boolean);
      const parts = [...suites, ...(p.cryptoRefArray || []).map(nm)];
      const all = [c.name, ...parts].join(' ');
      // 鍵交換を行うプロトコルは、ML-KEM等が見当たらなければ量子脆弱とみなす
      const kex = ['tls', 'dtls', 'ssh', 'ipsec', 'ike', 'sstp'].includes(p.type);
      r = {type:'protocol',
        p:{ptype:p.type || '', version:p.version || '', suites:parts},
        days:null, pq:(kex && !RE_PQ.test(norm(all))) ? 'vuln' : pqOf(all),
        weak:weakOf(parts.join(' ')),
        detail:[p.type, p.version].filter(Boolean).join(' ')};
    }
    if(!r) continue;
    r.name = c.name || ''; r.src = src; r.secret = !!(r.secret || secretBlock);
    r.warnAll = [...r.weak, ...(r.secret ? ['鍵の値を含む'] : [])];
    r.search = norm([r.type, r.name, r.detail, r.src, ...Object.values(r.p).flat()].join(' '));
    rows.push(r); n++;
  }
  bomCount++;
  return n;
}

/* ================= 読み込み(SVN / ローカル) ================= */
const loaded = new Set();

function showSelectedNames(){
  const names = [...loaded].map(p => p.split('/').pop());
  $('fname').value = names.join(', ');
}

function finish(msg){
  $('status').textContent = msg;
  $('errors').textContent = errors.join('\n');
  $('csv').disabled = !rows.length;
  showSelectedNames();
  render();
}

async function sha256Hex(buf){
  if(!window.crypto?.subtle) return null;
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// components 配列以外の、CBOMのヘッダー(トップレベルのメタ情報)を表示する
function renderHeader(bom){
  const items = [];
  const add = (label, value, mono) => { if(value) items.push({label, value, mono}); };

  add('形式', [bom.bomFormat, bom.specVersion ? 'v' + bom.specVersion : ''].filter(Boolean).join(' '));
  add('シリアル番号', bom.serialNumber, true);
  add('バージョン', (bom.version !== undefined && bom.version !== null) ? String(bom.version) : '');

  const ts = bom.metadata?.timestamp;
  if(ts){
    const t = Date.parse(ts);
    add('作成日時', isNaN(t) ? String(ts) : new Date(t).toISOString().replace('T', ' ').slice(0, 16) + ' UTC');
  }

  const comp = bom.metadata?.component;
  if(comp && typeof comp === 'object'){
    add('対象コンポーネント', [comp.name, comp.version, comp.type ? `(${comp.type})` : ''].filter(Boolean).join(' '));
    add('説明', comp.description);
  }

  let tools = bom.metadata?.tools;
  tools = Array.isArray(tools) ? tools : (Array.isArray(tools?.components) ? tools.components : []);
  const toolNames = tools.map(t => [t?.vendor, t?.name, t?.version].filter(Boolean).join(' ')).filter(Boolean);
  if(toolNames.length) add('生成ツール', toolNames.join(', '));

  const authors = bom.metadata?.authors;
  if(Array.isArray(authors) && authors.length){
    add('作成者', authors.map(a => a?.name).filter(Boolean).join(', '));
  }

  const total = Array.isArray(bom.components) ? flat(bom.components).length : 0;
  add('コンポーネント総数(入れ子含む)', total ? String(total) : '');

  const box = $('headerBox'), list = $('headerList');
  if(!items.length){ box.style.display = 'none'; list.innerHTML = ''; return; }
  list.innerHTML = items.map(it =>
    `<dt>${esc(it.label)}</dt><dd class="${it.mono ? 'mono' : ''}">${esc(it.value)}</dd>`).join('');
  box.style.display = '';
}

function hideHeader(){
  $('headerBox').style.display = 'none';
  $('headerList').innerHTML = '';
}

async function loadSingle(file, path){
  rows = []; errors = []; bomCount = 0; riskF = ''; loaded.clear();
  $('status').textContent = '読み込み中…';
  $('fhash').value = '';
  hideHeader();
  let ok = false;
  try{
    const buf = await file.arrayBuffer();
    const bom = JSON.parse(new TextDecoder('utf-8').decode(buf));
    ingest(bom, path);
    loaded.add(path); ok = true;
    const hash = await sha256Hex(buf);
    $('fhash').value = hash ?? '(このブラウザでは計算できません)';
    renderHeader(bom);
  }
  catch(e){ errors.push(`${path}: ${e.message}`); }
  let msg = '';
  if(!ok) msg = `${path} の読み込みに失敗しました。`;
  else if(!rows.length) msg = `${path} を読み込みましたが、暗号資産(証明書・鍵など)は見つかりませんでした。`;
  finish(msg);
}

$('pickFiles').addEventListener('click', () => $('files').click());
$('files').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if(f) await loadSingle(f, f.name);
});
['dragover', 'dragenter'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); document.body.classList.add('drop'); }));
document.addEventListener('dragleave', e => { if(!e.relatedTarget) document.body.classList.remove('drop'); });
document.addEventListener('drop', async e => {
  e.preventDefault(); document.body.classList.remove('drop');
  // DataTransfer は await の前に読み出す必要がある
  const entries = [...(e.dataTransfer.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const plain = [...e.dataTransfer.files];
  let picked = null, skippedDir = 0, skippedExtra = 0;
  if(entries.length){
    for(const entry of entries){
      if(entry.isFile){ if(!picked) picked = entry; else skippedExtra++; }
      else skippedDir++; // フォルダは読み込まない
    }
    if(picked) await loadSingle(await new Promise((res, rej) => picked.file(res, rej)), picked.name);
  } else {
    if(plain.length){ picked = plain[0]; skippedExtra = plain.length - 1; await loadSingle(picked, picked.name); }
  }
  if(skippedDir || skippedExtra){
    if(skippedDir) errors.push(`フォルダが${skippedDir}件ドロップされましたが、読み込みませんでした。ファイルを直接ドロップしてください。`);
    if(skippedExtra) errors.push(`複数のファイルがドロップされたため、最初の1件だけを読み込みました。`);
    $('errors').textContent = errors.join('\n');
  }
});
$('clear').addEventListener('click', () => {
  rows = []; errors = []; bomCount = 0; riskF = ''; loaded.clear();
  $('status').textContent = ''; $('fhash').value = ''; hideHeader(); finish('');
});

/* ================= 表示 ================= */
const fmtDate = s => { const t = Date.parse(s); return isNaN(t) ? esc(s) : new Date(t).toISOString().slice(0, 10); };
let expThresholdDays = 730; // 期限間近のしきい値(日数)。デフォルト2年
function daysTag(d){
  if(d === null) return '';
  if(d < 0)  return `<span class="tag ng">期限切れ ${-d}日</span>`;
  if(d <= expThresholdDays) return `<span class="tag warn">あと ${d}日</span>`;
  return `<span class="tag ok">${d}日</span>`;
}
// 量子耐性・古典的な危殆化・有効期限を、優先度付きの1つのリスクに統合する
// 数値が大きいほど深刻(表のソートにもそのまま使う)
function riskOf(r){
  if(r.pq === 'broken')  return {lv:4, t:'危殆化', cls:'ng'};
  if(r.pq === 'vuln')    return {lv:4, t:'量子脆弱', cls:'warn'};
  if(r.pq === 'unknown') return {lv:1, t:'判定不可', cls:'na'};
  if(r.pq === 'hybrid')  return {lv:0, t:'ハイブリッド', cls:'ok'};
  return {lv:0, t:'量子安全', cls:'ok'};
}
const TYPE_LABEL = {certificate:'証明書', algorithm:'アルゴリズム', material:'鍵・関連素材', protocol:'プロトコル'};
const C = (k, t, v, h, cls, x) => ({k, t, v, h, cls, x});
const cSrc  = C('src', '出所', r => r.src);
const cName = C('name', '名前', r => r.name);
const cDays = C('days', '残り日数', r => r.days, r => daysTag(r.days), 'num');
const cRisk = C('risk', 'リスク', r => riskOf(r).lv,
  r => `<span class="tag ${riskOf(r).cls}">${esc(riskOf(r).t)}</span>`, '',
  r => riskOf(r).t);

const TABS = [
  {id:'all', t:'すべて', cols:[
    cSrc, C('type', '種別', r => TYPE_LABEL[r.type]), cName, C('detail', '詳細', r => r.detail), cRisk]},
  {id:'certificate', t:'証明書', sort:'risk', cols:[
    cSrc, cName,
    C('subject', 'Subject', r => r.p.subject, null, 'dn'),
    C('issuer', 'Issuer', r => r.p.issuer, null, 'dn'),
    C('from', '開始日', r => r.p.from, r => fmtDate(r.p.from), 'date'),
    C('to', '有効期限', r => r.p.to, r => fmtDate(r.p.to), 'date'),
    cDays,
    C('sig', '署名アルゴリズム', r => r.p.sig),
    C('key', '公開鍵', r => r.p.key),
    cRisk,
    C('fmt', '形式', r => r.p.fmt)]},
  {id:'algorithm', t:'アルゴリズム', cols:[
    cSrc, cName,
    C('primitive', '用途', r => r.p.primitive),
    C('param', 'ファミリ/パラメータ', r => [r.p.fam, r.p.param].filter(Boolean).join(' ')),
    C('curve', '曲線', r => r.p.curve),
    C('funcs', '機能', r => r.p.funcs),
    cRisk]},
  {id:'material', t:'鍵・関連素材', cols:[
    cSrc, cName,
    C('mtype', '種類', r => r.p.mtype),
    C('algo', 'アルゴリズム', r => r.p.algo),
    C('size', 'サイズ(bit)', r => r.p.size),
    C('state', '状態', r => r.p.state),
    C('exp', '有効期限', r => r.p.exp, r => r.p.exp ? fmtDate(r.p.exp) + ' ' + daysTag(r.days) : '', 'date', r => r.p.exp),
    C('fmt', '形式', r => r.p.fmt),
    cRisk]},
  {id:'protocol', t:'プロトコル', cols:[
    cSrc, cName,
    C('ptype', '種類', r => r.p.ptype),
    C('version', 'バージョン', r => r.p.version),
    C('suites', '暗号スイート/構成要素', r => r.p.suites.length,
      r => r.p.suites.slice(0, 3).map(esc).join('<br>') + (r.p.suites.length > 3 ? `<br>他 ${r.p.suites.length - 3}件` : ''),
      'dn', r => r.p.suites.join('; ')),
    cRisk]},
];

const RISK = {
  pq: r => r.pq === 'vuln',
  broken: r => r.pq === 'broken',
  weak: r => r.weak.length > 0,
  expired: r => r.days !== null && r.days < 0,
  soon: r => r.days !== null && r.days >= 0 && r.days <= expThresholdDays,
  secret: r => r.secret,
};

function visibleRows(){
  const tab = TABS.find(t => t.id === tabId);
  const q = norm($('q').value.trim());
  let list = rows.filter(r => (tab.id === 'all' || r.type === tab.id) && (!riskF || RISK[riskF](r)) && (!q || r.search.includes(q)));
  const key = sortK ?? tab.sort;
  const col = tab.cols.find(c => c.k === key);
  if(col){
    const dir = sortK ? sortDir : 1;
    list = [...list].sort((a, b) => {
      let x = col.v(a), y = col.v(b);
      if(x === null || x === '' || x === undefined) return 1;
      if(y === null || y === '' || y === undefined) return -1;
      return (x > y ? 1 : x < y ? -1 : 0) * dir;
    });
  }
  return {tab, list, key};
}

function render(){
  // カード
  const n = f => rows.filter(f).length;
  const defs = [
    {f:'', l:'資産の総数', n:rows.length},
    {f:'pq', l:'量子脆弱', n:n(RISK.pq)},
    {f:'broken', l:'危殆化', n:n(RISK.broken)},
    {f:'expired', l:'期限切れ', n:n(RISK.expired)},
    {f:'soon', l:'期限間近', n:n(RISK.soon)},
    {f:'secret', l:'鍵の値を含む', n:n(RISK.secret)},
  ];
  $('cards').innerHTML = defs.map(d =>
    `<button class="card" data-f="${d.f}" aria-pressed="${d.f === riskF}"><b>${d.n}</b><span>${d.l}</span></button>`).join('');

  // 警告バナー
  const sec = n(RISK.secret), banner = $('secretBanner');
  banner.style.display = sec ? 'block' : 'none';
  banner.textContent = sec ? `鍵の値(秘密鍵などの本体)を含む可能性がある資産が ${sec}件あります。この画面では値を表示していませんが、該当するCBOMファイルの共有や保管には注意してください。` : '';

  // タブ
  $('tabs').innerHTML = TABS.map(t => {
    const c = t.id === 'all' ? rows.length : rows.filter(r => r.type === t.id).length;
    return `<button class="tab" role="tab" data-t="${t.id}" aria-selected="${t.id === tabId}">${t.t} (${c})</button>`;
  }).join('');

  // 表
  const {tab, list, key} = visibleRows();
  const dir = sortK ? sortDir : 1;
  $('head').innerHTML = tab.cols.map(c =>
    `<th data-k="${c.k}" tabindex="0" aria-sort="${c.k === key ? (dir > 0 ? 'ascending' : 'descending') : 'none'}">${c.t}</th>`).join('');
  if(!list.length){
    $('body').innerHTML = `<tr><td colspan="${tab.cols.length}" class="empty">${rows.length ? '条件に合う資産がありません。' : ''}</td></tr>`;
    return;
  }
  $('body').innerHTML = list.map(r => '<tr>' + tab.cols.map(c =>
    `<td class="${c.cls || ''}">${c.h ? c.h(r) : esc(c.v(r) ?? '')}</td>`).join('') + '</tr>').join('');
}

$('cards').addEventListener('click', e => {
  const b = e.target.closest('.card'); if(!b) return;
  riskF = (b.dataset.f === riskF) ? '' : b.dataset.f; render();
});
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if(!b) return;
  tabId = b.dataset.t; sortK = null; sortDir = 1; render();
});
function sortBy(k){ if(!k) return; sortDir = (sortK === k) ? -sortDir : 1; sortK = k; render(); }
$('head').addEventListener('click', e => sortBy(e.target.closest('th')?.dataset.k));
$('head').addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); sortBy(e.target.closest('th')?.dataset.k); }
});
$('q').addEventListener('input', render);
$('expYears').addEventListener('input', () => {
  const y = parseInt($('expYears').value, 10);
  expThresholdDays = (Number.isFinite(y) && y >= 0) ? y * 365 : 0;
  render();
});

$('csv').addEventListener('click', () => {
  const {tab, list} = visibleRows();
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const head = tab.cols.map(c => q(c.t)).join(',');
  const body = list.map(r => tab.cols.map(c => q(c.x ? c.x(r) : c.v(r))).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + head + '\r\n' + body], {type:'text/csv;charset=utf-8'}));
  a.download = `crypto-inventory-${tab.id}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
});

render();
</script>
</body>
</html>
